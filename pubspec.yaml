name: myapps_data
description: Shared WebDAV sync & data-management package for MyAnime/MyDay/MyDevice.
version: 1.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.3

# Dependency policy: this package must never constrain tighter than the three
# consumer apps. Do not add
# path_provider, file_picker, or shelf here — paths come through StorageAdapter
# and pickers/UI stay app-side.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  crypto: ^3.0.6
  path: ^1.9.0
  archive: ^4.0.4
  wakelock_plus: ^1.5.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  wakelock_plus_platform_interface: ^1.5.1
